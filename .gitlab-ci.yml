# CI for the HI WAF dashboard: typecheck, then build and push the container image
# to this project's GitLab Container Registry.

stages:
  - check
  - docker

# Fast gate: install deps and run the TypeScript check (strict, catches unused code).
typecheck:
  stage: check
  image: node:24.22.1-slim
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
  script:
    - npm ci --no-audit --no-fund
    - npx tsc --noEmit

# Build the image (the Dockerfile builds the SPA) and push it, using kaniko so no
# privileged Docker daemon is needed. Runs on the default branch (:sha) and on tags
# (:sha, :tag, :latest), so a release is `npm run release` + `git push --follow-tags`.
build-image:
  stage: docker
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  before_script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
  script:
    # Every build gets an immutable :sha tag; :latest and :vX.Y.Z move only on a release tag.
    - DESTINATIONS="--destination $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        DESTINATIONS="$DESTINATIONS --destination $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG --destination $CI_REGISTRY_IMAGE:latest"
      fi
    - /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/Dockerfile"
      $DESTINATIONS
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
