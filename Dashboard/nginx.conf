# Serves the HI WAF dashboard SPA. nginx runs envsubst on this template at startup and
# fills in ${WAF_IP} from the environment; its own variables ($uri, $host) are left untouched.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Runtime settings for the SPA, from the container environment.
    location = /env.js {
        default_type application/javascript;
        add_header Cache-Control "no-store" always;
        return 200 'window.__ENV = { WAF_IP: "${WAF_IP}" }';
    }

    # Hashed build output never changes: cache it for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Single-page app: serve the file if it exists, else hand the route to index.html
    # so client-side routing (/overview, /sites/..., /settings/...) works on refresh.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    # In production your portal proxies /api itself (reusing the Better Auth session and
    # adding the customer's token), so this container just serves the UI above.
    #
    # To instead talk straight to a WAF manager (standalone testing), uncomment this block
    # and run with -e WAF_API=https://223.26.0.228:9443 (add ENV WAF_API="" to the Dockerfile):
    #
    # location /api/ {
    #     proxy_pass ${WAF_API};
    #     proxy_ssl_verify off;             # the manager uses a self-signed cert
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
}
