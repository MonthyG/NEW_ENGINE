# Serves the HI WAF dashboard SPA. nginx:alpine runs envsubst on this template at
# startup; its own variables ($uri, $host) are left untouched.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: serve the file if it exists, else hand the route to index.html
    # so client-side routing (/overview, /sites/..., /settings/...) works on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # In production your portal proxies /api itself (reusing the Better Auth session and
    # adding the customer's token), so this container just serves the UI above.
    #
    # To instead talk straight to a WAF manager (standalone testing), set WAF_API in the
    # environment (e.g. https://223.26.0.228:9443) and uncomment this block:
    #
    # location /api/ {
    #     proxy_pass ${WAF_API};
    #     proxy_ssl_verify off;             # the manager uses a self-signed cert
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
}
